name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: Install the tested dependency set
        run: pip install -r requirements.lock -r requirements-dev.txt
      - name: Run the suite (solves all 10 rooms end to end through the HTTP routes)
        run: python -m pytest tests -q

  security:
    name: bandit + pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install bandit pip-audit
      - name: Static analysis (intentional simulation fixtures carry `# nosec` + reason)
        run: bandit -r . -x ./tests -q
      - name: Known-vulnerability audit of everything that ships in the image
        run: pip-audit -r requirements-prod.txt

  container:
    name: container build + smoke check
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t labdemo:ci .
      - name: Start it with the production settings
        run: |
          docker run -d --name labdemo -p 8000:8000 \
            -e LABDEMO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
            -e LABDEMO_SECURE_COOKIES=1 -e LABDEMO_TRUST_PROXY=1 \
            -e LABDEMO_ALLOWED_HOSTS=labs.example.com \
            labdemo:ci
      - name: Wait for the image's own HEALTHCHECK to pass
        run: |
          for i in $(seq 1 40); do
            state=$(docker inspect -f '{{.State.Health.Status}}' labdemo)
            echo "health: $state"
            [ "$state" = healthy ] && exit 0
            sleep 3
          done
          exit 1
      - name: Smoke check (pretends to be the HTTPS proxy)
        run: python3 scripts/smoke_check.py --base http://127.0.0.1:8000 --simulate-proxy labs.example.com
      - name: Container logs
        if: failure()
        run: docker logs labdemo
