# nginx alternative for a host install (gunicorn on 127.0.0.1:8000, see DEPLOYMENT.md).
# Drop in /etc/nginx/conf.d/labdemo.conf, replace labs.example.com, get certs with certbot.
# Needs nginx >= 1.25.1 for `http2 on;` (on older versions put `http2` on the listen line instead).
#
# App environment:  LABDEMO_SECURE_COOKIES=1  LABDEMO_TRUST_PROXY=1  LABDEMO_PROXY_HOPS=1
#                   LABDEMO_ALLOWED_HOSTS=labs.example.com

limit_req_zone $binary_remote_addr zone=labdemo:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name labs.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name labs.example.com;

    ssl_certificate     /etc/letsencrypt/live/labs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labs.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;          # no nginx version in Server header / error pages
    client_max_body_size 64k;   # matches the app's MAX_CONTENT_LENGTH

    location / {
        limit_req zone=labdemo burst=40 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 35s;                      # > gunicorn's 30 s worker timeout

        proxy_set_header Host              $host;
        # OVERWRITE, never `$proxy_add_x_forwarded_for`: that appends to a client-supplied header,
        # letting anyone spoof their IP (and dodge the per-IP rate limits).
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
